services:
  postgres_db:
    image: postgres:15
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backup_complete.sql:/docker-entrypoint-initdb.d/backup_complete.sql

  backend_api:
    build: ./ApiRestaurante
    environment:
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL in .env}
    depends_on:
      - postgres_db
    ports:
      - "5001:5000"

  frontend_api:
    build: ./AppRestaurante
    environment:
      S3_BUCKET_NAME: ${S3_BUCKET_NAME:-}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-}
      S3_PUBLIC_BASE_URL: ${S3_PUBLIC_BASE_URL:-}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-false}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      IMAGE_WORKERS: ${IMAGE_WORKERS:-2}
      IMAGE_QUEUE_MAXSIZE: ${IMAGE_QUEUE_MAXSIZE:-100}
      IMAGE_QUEUE_PUT_TIMEOUT_SEC: ${IMAGE_QUEUE_PUT_TIMEOUT_SEC:-2.0}
      IMAGE_SHUTDOWN_TIMEOUT_SEC: ${IMAGE_SHUTDOWN_TIMEOUT_SEC:-30}
      IMAGE_MAX_FILE_MB: ${IMAGE_MAX_FILE_MB:-5}
      IMAGE_ALLOWED_CONTENT_TYPES: ${IMAGE_ALLOWED_CONTENT_TYPES:-image/jpeg,image/png,image/webp}
      IMAGE_ALLOWED_TARGETS: ${IMAGE_ALLOWED_TARGETS:-logo,dish,general}
    stop_grace_period: 40s
    ports:
      - "8000:8000"

volumes:
  postgres_data:
