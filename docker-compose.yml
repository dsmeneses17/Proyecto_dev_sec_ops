services:
  postgres_db:
    image: postgres:15
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 1234
      POSTGRES_DB: Restaurante
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend_api:
    build: ./ApiRestaurante
    environment:
      DB_HOST: postgres_db
      DB_USER: postgres
      DB_PASSWORD: 1234
      DB_NAME: Restaurante
    depends_on:
      - postgres_db
    ports:
      - "5000:5000"

  frontend_api:
    build: ./AppRestaurante
    ports:
      - "8000:8000"

volumes:
  postgres_data:
