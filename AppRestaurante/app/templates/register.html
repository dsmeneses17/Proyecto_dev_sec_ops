{% extends "base.html" %}

{% block title %}Registro{% endblock %}

{% block content %}
<div class="login-page">
    <div class="login-container">
        <div class="mb-3">
            <h2 class="mb-1">Crear cuenta</h2>
            <div class="text-muted">Regístrate como cliente.</div>
        </div>

        {% if error %}
        <div class="alert alert-danger">{{ error }}</div>
        {% endif %}

        <form action="/api/v1/auth/register-client" method="post" class="mt-3">
            <div class="mb-3">
                <label class="form-label" for="nombre_completo">Nombre completo</label>
                <input class="form-control" type="text" id="nombre_completo" name="nombre_completo" autocomplete="name"
                    required>
            </div>

            <div class="mb-3">
                <label class="form-label" for="usuario">Usuario</label>
                <input class="form-control" type="text" id="usuario" name="usuario" autocomplete="username" required>
            </div>

            <div class="mb-3">
                <label class="form-label" for="email">Correo electrónico</label>
                <input class="form-control" type="email" id="email" name="email" autocomplete="email" required>
            </div>

            <div class="mb-3">
                <label class="form-label" for="password">Contraseña</label>
                <input class="form-control" type="password" id="password" name="password" autocomplete="new-password"
                    minlength="6" required>
            </div>

            <button class="btn btn-primary w-100" type="submit">Registrar</button>
        </form>

        <div class="text-center mt-3">
            <a href="/">¿Ya tienes cuenta? Inicia sesión</a>
        </div>
        <div class="text-center mt-2">
            <a href="/registro">¿Eres dueño de restaurante? Regístrate aquí</a>
        </div>
    </div>
</div>
{% endblock %}
