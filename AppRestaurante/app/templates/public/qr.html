<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>QR Menú</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container text-center py-5">

    <h3 class="mb-4">Código QR del Menú</h3>

    <img src="data:image/png;base64,{{ qr_base64 }}"
         class="img-fluid mb-4"
         style="max-width: 300px;">

    <p class="text-muted">{{ url_publica }}</p>

    <div class="d-flex gap-2 justify-content-center flex-wrap">
      <a href="{{ qr_png_download_url }}" class="btn btn-primary">
          Descargar QR PNG
      </a>
      <a href="{{ qr_svg_download_url }}" class="btn btn-outline-primary">
          Descargar QR SVG
      </a>
    </div>

</div>

</body>
</html>
