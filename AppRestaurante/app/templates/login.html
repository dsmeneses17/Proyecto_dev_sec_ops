{% extends "base.html" %}

{% block content %}
<div class="login-page">

  <div class="login-container">
    <div class="mb-3">
      <h2 class="mb-1">Iniciar sesión</h2>
      <div class="text-muted">Administra tu restaurante y tu menú.</div>
    </div>

    <form method="post" action="/api/v1/auth/login" class="mt-3">
      <div class="mb-3">
        <label class="form-label">Usuario</label>
        <input class="form-control" type="text" name="usuario" placeholder="admin" autocomplete="username" required />
      </div>

      <div class="mb-3">
        <label class="form-label">Contraseña</label>
        <input class="form-control" type="password" name="password" placeholder="••••••••" autocomplete="current-password" required />
      </div>

      <button type="submit" class="btn w-100">Entrar</button>
    </form>

    {% if error %}
      <div id="msg" class="mt-3">
        <div class="alert alert-danger mb-0">{{ error }}</div>
      </div>
    {% endif %}
  </div>

</div>
{% endblock %}
