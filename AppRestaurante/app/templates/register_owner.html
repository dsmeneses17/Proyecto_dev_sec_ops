{% extends "base.html" %}

{% block title %}Registro{% endblock %}

{% block content %}
<div class="container-fluid px-3 px-md-4 px-lg-5">
    <div class="py-4" style="min-height: calc(100vh - 80px);">
        <div class="p-0 p-md-2">
            <div class="d-flex align-items-start justify-content-between gap-3 flex-wrap">
                <div>
                    <h1 class="h4 mb-1">Registro</h1>
                    <div class="text-muted">Crea un usuario administrador y tu restaurante.</div>
                </div>
                <a href="/" class="btn btn-outline-secondary">Volver</a>
            </div>

            <form method="post" action="/registro" class="mt-4">
                <div class="row g-3">
                    <div class="col-12 col-md-6">
                        <label class="form-label">Nombre completo</label>
                        <input class="form-control" type="text" name="nombre_completo" autocomplete="name" required />
                    </div>
                    <div class="col-12 col-md-6">
                        <label class="form-label">Email</label>
                        <input class="form-control" type="email" name="email" autocomplete="email" required />
                    </div>

                    <div class="col-12 col-md-6">
                        <label class="form-label">Usuario</label>
                        <input class="form-control" type="text" name="usuario" autocomplete="username" required />
                    </div>
                    <div class="col-12 col-md-6">
                        <label class="form-label">Contraseña</label>
                        <input class="form-control" type="password" name="password" autocomplete="new-password"
                            required />
                    </div>

                    <hr class="my-2" />

                    <div class="col-12">
                        <label class="form-label">Nombre del restaurante</label>
                        <input class="form-control" type="text" name="restaurant_nombre" required />
                    </div>
                    <div class="col-12 col-md-6">
                        <label class="form-label">Slug</label>
                        <input class="form-control" type="text" name="restaurant_slug" placeholder="mi-restaurante"
                            required />
                        <div class="form-text">Solo letras, números y guiones. Se usa para el menú público.</div>
                    </div>
                    <div class="col-12 col-md-6">
                        <label class="form-label">Teléfono</label>
                        <input class="form-control" type="text" name="restaurant_telefono" />
                    </div>
                    <div class="col-12">
                        <label class="form-label">Dirección</label>
                        <input class="form-control" type="text" name="restaurant_direccion" />
                    </div>

                    <div class="col-12">
                        <button class="btn btn-primary w-100" type="submit">Crear cuenta</button>
                    </div>
                </div>
            </form>

            {% if error %}
            <div class="alert alert-danger mt-3 mb-0">{{ error }}</div>
            {% endif %}
        </div>
    </div>
</div>
{% endblock %}
