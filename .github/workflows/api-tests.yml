name: api-tests

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: 1234
          POSTGRES_DB: Restaurante_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d Restaurante_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    defaults:
      run:
        shell: bash
        working-directory: ApiRestaurante

    env:
      DATABASE_URL: postgresql+psycopg2://postgres:1234@localhost:5432/Restaurante_test

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio

      - name: Run service unit tests (fast)
        run: python -m pytest -q -rA --disable-warnings tests/test_services_*.py

      - name: Run repository tests (Postgres)
        run: python -m pytest -q -rA --disable-warnings tests/test_repositories_*.py

  apprestaurante-pytest:
    runs-on: ubuntu-latest

    defaults:
      run:
        shell: bash
        working-directory: AppRestaurante

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run tests
        run: python -m pytest -q -rA --disable-warnings

  playwright-e2e:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install E2E dependencies
        working-directory: e2e
        run: npm ci

      - name: Install Playwright browsers
        working-directory: e2e
        run: npx playwright install --with-deps

      - name: Boot app (docker compose)
        run: docker compose up -d --build

      - name: Wait for frontend
        env:
          E2E_BASE_URL: http://localhost:8000
        run: |
          node -e "const http=require('http'); const url=process.env.E2E_BASE_URL; const deadline=Date.now()+120000; (function ping(){ http.get(url,res=>{ if(res.statusCode && res.statusCode<500){ console.log('ready:',url,res.statusCode); process.exit(0);} res.resume(); retry(); }).on('error', retry); function retry(){ if(Date.now()>deadline){ console.error('timeout waiting for',url); process.exit(1);} setTimeout(ping, 1500);} })();"

      - name: Run Playwright tests
        working-directory: e2e
        env:
          CI: "true"
          E2E_BASE_URL: http://localhost:8000
        run: npm run test:ci

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            e2e/playwright-report
            e2e/test-results

      - name: Dump docker logs on failure
        if: failure()
        run: docker compose logs --no-color --timestamps

      - name: Shutdown app
        if: always()
        run: docker compose down -v
