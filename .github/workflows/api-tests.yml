name: api-tests

on:
  push:
    branches: ["main", "secrets-managing-avoid-paste"]
  pull_request:

jobs:
  apirestaurante-pytest:
    name: ApiRestaurante — pytest (services + repositories + API contract)
    runs-on: ubuntu-latest

    env:
      POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
      POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
      POSTGRES_DB: ${{ secrets.POSTGRES_DB }}

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    defaults:
      run:
        shell: bash
        working-directory: ApiRestaurante

    steps:
      - uses: actions/checkout@v4

      - name: Build DATABASE_URL (tests)
        run: |
          echo "DATABASE_URL=postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@localhost:5432/${POSTGRES_DB}" >> "$GITHUB_ENV"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio

      - name: Run service unit tests (fast)
        run: python -m pytest -q -rA --disable-warnings tests/test_services_*.py

      - name: Run repository tests (Postgres)
        run: python -m pytest -q -rA --disable-warnings tests/test_repositories_*.py

      - name: Run API contract tests (in-process)
        run: python -m pytest -q -rA --disable-warnings tests/test_api_*.py

  apprestaurante-pytest:
    name: AppRestaurante — pytest
    runs-on: ubuntu-latest

    defaults:
      run:
        shell: bash
        working-directory: AppRestaurante

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run tests
        run: python -m pytest -q -rA --disable-warnings

  playwright-e2e:
    name: Playwright — E2E (docker compose)
    runs-on: ubuntu-latest

    env:
      POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
      POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
      POSTGRES_DB: ${{ secrets.POSTGRES_DB }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install E2E dependencies
        working-directory: e2e
        run: npm ci

      - name: Install Playwright browsers
        working-directory: e2e
        run: npx playwright install --with-deps

      - name: Build DATABASE_URL (docker compose)
        run: |
          echo "DATABASE_URL=postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres_db:5432/${POSTGRES_DB}" >> "$GITHUB_ENV"

      - name: Boot app (docker compose)
        run: docker compose up -d --build

      - name: Wait for frontend
        env:
          E2E_BASE_URL: http://localhost:8000
        run: |
          node -e "const http=require('http'); const url=process.env.E2E_BASE_URL; const deadline=Date.now()+120000; (function ping(){ http.get(url,res=>{ if(res.statusCode && res.statusCode<500){ console.log('ready:',url,res.statusCode); process.exit(0);} res.resume(); retry(); }).on('error', retry); function retry(){ if(Date.now()>deadline){ console.error('timeout waiting for',url); process.exit(1);} setTimeout(ping, 1500);} })();"

      - name: Diagnostics (routes + auth wiring)
        if: always()
        env:
          FRONTEND_BASE_URL: http://localhost:8000
          BACKEND_BASE_URL: http://localhost:5001
        run: |
          set -euxo pipefail

          echo "--- docker compose ps ---"
          docker compose ps

          echo "--- frontend: GET / ---"
          curl -sS -D- -o /dev/null "$FRONTEND_BASE_URL/" | head -n 40

          echo "--- frontend: GET /api/v1/auth/login (UI) ---"
          curl -sS -D- -o /dev/null "$FRONTEND_BASE_URL/api/v1/auth/login" | head -n 60

          echo "--- backend: GET common docs/health candidates ---"
          for p in /docs /openapi.json /health /api/v1/docs /api/v1/openapi.json /api/v1/health; do
            echo ">>> GET $BACKEND_BASE_URL$p"
            curl -sS -D- -o /dev/null "$BACKEND_BASE_URL$p" | head -n 20 || true
          done

          echo "--- backend: POST auth/login candidates (expect 200/4xx, but not 404 if route exists) ---"
          for p in /auth/login /api/v1/auth/login; do
            echo ">>> POST $BACKEND_BASE_URL$p"
            curl -sS -D- -o /dev/null -X POST "$BACKEND_BASE_URL$p" \
              -H 'content-type: application/json' \
              --data '{"usuario":"__probe__","password":"__probe__"}' | head -n 40 || true
          done

          echo "--- in-network probes (frontend_api -> backend_api:5000) ---"
          docker compose exec -T frontend_api python - <<'PY'
          import requests

          BASE = "http://backend_api:5000"

          def probe(method: str, path: str, **kwargs):
            url = BASE + path
            try:
              r = requests.request(method, url, timeout=5, **kwargs)
              print(f"{method} {path} -> {r.status_code}")
              ct = r.headers.get("content-type", "")
              if ct:
                print(f"  content-type: {ct}")
            except Exception as e:
              print(f"{method} {path} -> ERROR: {e}")

          for p in ("/docs", "/openapi.json", "/health", "/api/v1/docs", "/api/v1/openapi.json", "/api/v1/health"):
            probe("GET", p)

          payload = {"usuario": "__probe__", "password": "__probe__"}
          for p in ("/auth/login", "/api/v1/auth/login"):
            probe("POST", p, json=payload)
          PY

          echo "--- last 200 lines: backend ---"
          docker compose logs --no-color --timestamps --tail=200 backend_api | cat

          echo "--- last 200 lines: frontend ---"
          docker compose logs --no-color --timestamps --tail=200 frontend_api | cat

      - name: Run Playwright tests
        working-directory: e2e
        env:
          CI: "true"
          E2E_BASE_URL: http://localhost:8000
        run: npm run test:ci

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            e2e/playwright-report
            e2e/test-results

      - name: Dump docker logs on failure
        if: failure()
        run: docker compose logs --no-color --timestamps

      - name: Shutdown app
        if: always()
        run: docker compose down -v
