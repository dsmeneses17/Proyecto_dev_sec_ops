name: api-tests

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: 1234
          POSTGRES_DB: Restaurante_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d Restaurante_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    defaults:
      run:
        shell: bash
        working-directory: ApiRestaurante

    env:
      DATABASE_URL: postgresql+psycopg2://postgres:1234@localhost:5432/Restaurante_test

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio

      - name: Run service unit tests (fast)
        run: python -m pytest tests/test_services_*.py

      - name: Run repository tests (Postgres)
        run: python -m pytest tests/test_repositories_*.py
