name: api-tests

on:
  push:
    branches: ["main", "secrets-managing-avoid-paste"]
  pull_request:
  workflow_dispatch:

jobs:
  ruff-lint:
    name: Ruff — Python lint (RNF-06)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install ruff
        run: pip install ruff

      - name: Run ruff check
        run: ruff check --config pyproject.toml

      - name: Run ruff format --check
        run: ruff format --check --config pyproject.toml || echo "::warning::ruff format differences found (non-blocking)"

  apirestaurante-pytest:
    name: ApiRestaurante — pytest (services + repositories + API contract)
    runs-on: ubuntu-latest

    env:
      POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
      POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
      POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
      SECRET_KEY: ci-secret-key-for-tests

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    defaults:
      run:
        shell: bash
        working-directory: ApiRestaurante

    steps:
      - uses: actions/checkout@v4

      - name: Build DATABASE_URL (tests)
        run: |
          echo "DATABASE_URL=postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@localhost:5432/${POSTGRES_DB}" >> "$GITHUB_ENV"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio pytest-cov

      - name: Run service unit tests (fast)
        run: python -m pytest -q -rA --disable-warnings --no-cov tests/test_services_*.py

      - name: Run utility unit tests (fast, no DB)
        run: python -m pytest -q -rA --disable-warnings --no-cov tests/test_utils_*.py

      - name: Run repository tests (Postgres)
        run: python -m pytest -q -rA --disable-warnings --no-cov tests/test_repositories_*.py

      - name: Run API contract tests (in-process)
        run: python -m pytest -q -rA --disable-warnings --no-cov tests/test_api_*.py

      - name: Run full suite with coverage (RNF-07)
        run: |
          python -m pytest tests/ \
            --cov=app \
            --cov-report=term-missing \
            --cov-fail-under=60 \
            -q --disable-warnings

  apprestaurante-pytest:
    name: AppRestaurante — pytest
    runs-on: ubuntu-latest

    env:
      SECRET_KEY: ci-secret-key-for-tests

    defaults:
      run:
        shell: bash
        working-directory: AppRestaurante

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov

      - name: Run tests with coverage (RNF-07)
        run: |
          python -m pytest tests/ \
            --cov=app \
            --cov-report=term-missing \
            -q -rA --disable-warnings

  playwright-e2e:
    name: Playwright — E2E (docker compose)
    runs-on: ubuntu-latest

    env:
      POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
      POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
      POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
      SECRET_KEY: ci-secret-key-for-tests

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install E2E dependencies
        working-directory: e2e
        run: npm ci

      - name: Install Playwright browsers
        working-directory: e2e
        run: npx playwright install --with-deps

      - name: Build DATABASE_URL (docker compose)
        run: |
          echo "DATABASE_URL=postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres_db:5432/${POSTGRES_DB}" >> "$GITHUB_ENV"

      - name: Boot app (docker compose)
        run: docker compose up -d --build

      - name: Wait for frontend
        env:
          E2E_BASE_URL: https://localhost
        run: |
          for i in {1..80}; do
            code=$(curl -k -s -o /dev/null -w "%{http_code}" "$E2E_BASE_URL/") || true
            if [ -n "$code" ] && [ "$code" -lt 500 ]; then
              echo "ready: $E2E_BASE_URL -> $code"
              exit 0
            fi
            sleep 1.5
          done
          echo "timeout waiting for $E2E_BASE_URL"
          exit 1

      - name: Diagnostics (routes + auth wiring)
        if: always()
        env:
          FRONTEND_BASE_URL: https://localhost
          BACKEND_BASE_URL: https://localhost/backend-api
        run: |
          set -euxo pipefail

          echo "--- docker compose ps ---"
          docker compose ps

          echo "--- frontend: GET / ---"
          curl -k -sS -D- -o /dev/null "$FRONTEND_BASE_URL/" | head -n 40

          echo "--- frontend: GET /api/v1/auth/login (UI) ---"
          curl -k -sS -D- -o /dev/null "$FRONTEND_BASE_URL/api/v1/auth/login" | head -n 60

          echo "--- backend: GET common docs/health candidates ---"
          for p in /docs /openapi.json /health /api/v1/docs /api/v1/openapi.json /api/v1/health; do
            echo ">>> GET $BACKEND_BASE_URL$p"
            curl -k -sS -D- -o /dev/null "$BACKEND_BASE_URL$p" | head -n 20 || true
          done

          echo "--- backend: POST auth/login candidates (expect 200/4xx, but not 404 if route exists) ---"
          for p in /auth/login /api/v1/auth/login; do
            echo ">>> POST $BACKEND_BASE_URL$p"
            curl -k -sS -D- -o /dev/null -X POST "$BACKEND_BASE_URL$p" \
              -H 'content-type: application/json' \
              --data '{"usuario":"__probe__","password":"__probe__"}' | head -n 40 || true
          done

          echo "--- in-network probes (frontend_api -> backend_api:5000) ---"
          docker compose exec -T frontend_api python - <<'PY' || true
          import requests

          BASE = "http://backend_api:5000"

          def probe(method: str, path: str, **kwargs):
            url = BASE + path
            try:
              r = requests.request(method, url, timeout=5, **kwargs)
              print(f"{method} {path} -> {r.status_code}")
              ct = r.headers.get("content-type", "")
              if ct:
                print(f"  content-type: {ct}")
            except Exception as e:
              print(f"{method} {path} -> ERROR: {e}")

          for p in ("/docs", "/openapi.json", "/health", "/api/v1/docs", "/api/v1/openapi.json", "/api/v1/health"):
            probe("GET", p)

          payload = {"usuario": "__probe__", "password": "__probe__"}
          for p in ("/auth/login", "/api/v1/auth/login"):
            probe("POST", p, json=payload)
          PY

          echo "--- last 200 lines: backend ---"
          docker compose logs --no-color --timestamps --tail=200 backend_api | cat

          echo "--- last 200 lines: frontend ---"
          docker compose logs --no-color --timestamps --tail=200 frontend_api | cat

      - name: Run Playwright tests
        working-directory: e2e
        env:
          CI: "true"
          E2E_BASE_URL: https://localhost
        run: npm run test:ci

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            e2e/playwright-report
            e2e/test-results

      - name: Dump docker logs on failure
        if: failure()
        run: docker compose logs --no-color --timestamps

      - name: Shutdown app
        if: always()
        run: docker compose down -v

  lighthouse-audit:
    name: Lighthouse — Score ≥ 90 (RNF-09)
    runs-on: ubuntu-latest

    env:
      POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
      POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
      POSTGRES_DB: ${{ secrets.POSTGRES_DB }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Lighthouse CI
        run: npm install -g @lhci/cli

      - name: Install Chrome
        run: |
          sudo apt-get update
          sudo apt-get install -y google-chrome-stable || true

      - name: Build DATABASE_URL
        run: |
          echo "DATABASE_URL=postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres_db:5432/${POSTGRES_DB}" >> "$GITHUB_ENV"

      - name: Boot app (docker compose)
        run: docker compose up -d --build

      - name: Wait for frontend
        run: |
          for i in {1..80}; do
            code=$(curl -k -s -o /dev/null -w "%{http_code}" "https://localhost/") || true
            if [ -n "$code" ] && [ "$code" -lt 500 ]; then
              echo "ready: https://localhost -> $code"
              exit 0
            fi
            sleep 1.5
          done
          echo "timeout waiting for https://localhost"
          exit 1

      - name: Run Lighthouse CI audit
        env:
          LHCI_URL: https://localhost/api/v1/auth/login
        run: lhci autorun --config=lighthouserc.js || true

      - name: Upload Lighthouse report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-report
          path: .lighthouseci/

      - name: Shutdown app
        if: always()
        run: docker compose down -v

  build-and-scan-images:
    name: Build + Trivy scan (block High/Critical)
    runs-on: ubuntu-latest
    needs:
      - ruff-lint
      - apirestaurante-pytest
      - apprestaurante-pytest
      - playwright-e2e
      - lighthouse-audit
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      id-token: write
    strategy:
      matrix:
        include:
          - image_name: backend-api
            dockerfile: ApiRestaurante/Dockerfile
            context: ApiRestaurante
          - image_name: frontend-api
            dockerfile: AppRestaurante/Dockerfile
            context: AppRestaurante

    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud (OIDC)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SA }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker auth for Artifact Registry
        run: gcloud auth configure-docker ${{ vars.GCP_REGION }}-docker.pkg.dev --quiet

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.ARTIFACT_REGISTRY_REPO }}/${{ matrix.image_name }}:${{ github.sha }}

      - name: Security gate - Trivy (HIGH,CRITICAL)
        uses: aquasecurity/trivy-action@v0.35.0
        with:
          scan-type: image
          image-ref: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.ARTIFACT_REGISTRY_REPO }}/${{ matrix.image_name }}:${{ github.sha }}
          vuln-type: os,library
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: 1
          format: table

  deploy-cloud-run:
    name: Deploy to Cloud Run (gated)
    runs-on: ubuntu-latest
    needs:
      - build-and-scan-images
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.build-and-scan-images.result == 'success'
    permissions:
      contents: read
      id-token: write
    strategy:
      matrix:
        include:
          - image_name: backend-api
            service_var: CLOUD_RUN_BACKEND_SERVICE
          - image_name: frontend-api
            service_var: CLOUD_RUN_FRONTEND_SERVICE

    steps:
      - name: Authenticate to Google Cloud (OIDC)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SA }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Resolve Cloud Run service name
        id: service_name
        shell: bash
        run: |
          if [ "${{ matrix.service_var }}" = "CLOUD_RUN_BACKEND_SERVICE" ]; then
            echo "name=${{ vars.CLOUD_RUN_BACKEND_SERVICE }}" >> "$GITHUB_OUTPUT"
          else
            echo "name=${{ vars.CLOUD_RUN_FRONTEND_SERVICE }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy scanned image to Cloud Run
        run: |
          gcloud run deploy "${{ steps.service_name.outputs.name }}" \
            --image "${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.ARTIFACT_REGISTRY_REPO }}/${{ matrix.image_name }}:${{ github.sha }}" \
            --region "${{ vars.GCP_REGION }}" \
            --platform managed \
            --quiet
