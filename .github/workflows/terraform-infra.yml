name: terraform-infra

on:
  pull_request:
    paths:
      - "infra/terraform/**"
      - ".github/workflows/terraform-infra.yml"
  push:
    branches: ["main"]
    paths:
      - "infra/terraform/**"
      - ".github/workflows/terraform-infra.yml"
  workflow_dispatch:

concurrency:
  group: terraform-foundation-dev-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  TF_WORKING_DIR: infra/terraform/envs/foundation-dev

jobs:
  plan-dev:
    name: Terraform plan (foundation-dev)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud (OIDC)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SA }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Configure backend block for CI
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          cat > backend.auto.tf <<'EOF'
          terraform {
            backend "gcs" {}
          }
          EOF

      - name: Terraform init
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          terraform init \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="prefix=${{ vars.TF_STATE_PREFIX_DEV }}" \
            -upgrade

      - name: Terraform fmt check
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform fmt -recursive

      - name: Terraform validate
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform validate

      - name: Terraform plan
        working-directory: ${{ env.TF_WORKING_DIR }}
        env:
          TF_VAR_project_id: ${{ vars.GCP_PROJECT_ID }}
          TF_VAR_region: ${{ vars.GCP_REGION }}
          TF_VAR_create_cloud_run: "true"
          TF_VAR_frontend_image: ${{ vars.ARTIFACT_REGISTRY_REPO }}/frontend-api:${{ github.sha }}
          TF_VAR_backend_image: ${{ vars.ARTIFACT_REGISTRY_REPO }}/backend-api:${{ github.sha }}
          TF_VAR_db_password: ${{ secrets.TF_VAR_DB_PASSWORD }}
          TF_VAR_jwt_secret: ${{ secrets.TF_VAR_JWT_SECRET }}
        run: terraform plan -out=tfplan

      - name: Upload plan artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: terraform-dev-plan
          path: |
            ${{ env.TF_WORKING_DIR }}/tfplan
            ${{ env.TF_WORKING_DIR }}/backend.auto.tf

  security-scan-dev:
    name: Security scan IaC (block High/Critical)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Trivy config scan (HIGH,CRITICAL)
        uses: aquasecurity/trivy-action@0.35.0
        with:
          scan-type: config
          scan-ref: infra/terraform
          severity: HIGH,CRITICAL
          exit-code: 1
          format: table

  apply-dev:
    name: Terraform apply (foundation-dev)
    runs-on: ubuntu-latest
    needs: [plan-dev, security-scan-dev]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.plan-dev.result == 'success' && needs.security-scan-dev.result == 'success'
    environment: gcp-dev

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud (OIDC)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SA }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Configure backend block for CI
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          cat > backend.auto.tf <<'EOF'
          terraform {
            backend "gcs" {}
          }
          EOF

      - name: Terraform init
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          terraform init \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="prefix=${{ vars.TF_STATE_PREFIX_DEV }}" \
            -upgrade

      - name: Terraform apply
        working-directory: ${{ env.TF_WORKING_DIR }}
        env:
          TF_VAR_project_id: ${{ vars.GCP_PROJECT_ID }}
          TF_VAR_region: ${{ vars.GCP_REGION }}
          TF_VAR_create_cloud_run: "true"
          TF_VAR_frontend_image: ${{ vars.ARTIFACT_REGISTRY_REPO }}/frontend-api:${{ github.sha }}
          TF_VAR_backend_image: ${{ vars.ARTIFACT_REGISTRY_REPO }}/backend-api:${{ github.sha }}
          TF_VAR_db_password: ${{ secrets.TF_VAR_DB_PASSWORD }}
          TF_VAR_jwt_secret: ${{ secrets.TF_VAR_JWT_SECRET }}
        run: terraform apply -auto-approve
