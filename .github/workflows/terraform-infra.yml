name: terraform-infra

on:
  pull_request:
    paths:
      - "infra/terraform/**"
      - ".github/workflows/terraform-infra.yml"
  push:
    branches: ["main"]
    paths:
      - "infra/terraform/**"
      - ".github/workflows/terraform-infra.yml"
  workflow_dispatch:

concurrency:
  group: terraform-foundation-dev-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  TF_WORKING_DIR: infra/terraform/envs/foundation-dev

jobs:
  plan-dev:
    name: Terraform plan (foundation-dev)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud (OIDC)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SA }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Configure backend block for CI
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          cat > backend.auto.tf <<'EOF'
          terraform {
            backend "gcs" {}
          }
          EOF

      - name: Terraform init
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          terraform init \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="prefix=${{ vars.TF_STATE_PREFIX_DEV }}" \
            -upgrade

      - name: Adopt existing foundation resources into state (idempotent)
        working-directory: ${{ env.TF_WORKING_DIR }}
        env:
          TF_VAR_project_id: ${{ vars.GCP_PROJECT_ID }}
        run: |
          set -euo pipefail

          import_if_missing() {
            local address="$1"
            local import_id="$2"

            if terraform state show "$address" >/dev/null 2>&1; then
              echo "State already contains $address"
              return 0
            fi

            echo "Importing $address from $import_id"
            if terraform import "$address" "$import_id"; then
              echo "Imported $address"
            else
              echo "::warning::Could not import $address (it may not exist yet)."
            fi
          }

          PROJECT_ID="${{ vars.GCP_PROJECT_ID }}"
          ENV_NAME="foundation-dev"
          PREFIX="livemenu-${ENV_NAME}"
          BUCKET_NAME="${PREFIX}-images-${PROJECT_ID}"

          import_if_missing "module.vpc.google_compute_network.this" "projects/${PROJECT_ID}/global/networks/${PREFIX}-vpc"
          import_if_missing "google_service_account.worker[0]" "projects/${PROJECT_ID}/serviceAccounts/lm-worker-${ENV_NAME}@${PROJECT_ID}.iam.gserviceaccount.com"
          import_if_missing "module.waf[0].google_compute_security_policy.this" "projects/${PROJECT_ID}/global/securityPolicies/${PREFIX}-armor"
          import_if_missing "module.storage[0].google_storage_bucket.this" "${BUCKET_NAME}"

      - name: Terraform fmt check
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform fmt -recursive

      - name: Terraform validate
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform validate

      - name: Terraform plan
        working-directory: ${{ env.TF_WORKING_DIR }}
        env:
          TF_VAR_project_id: ${{ vars.GCP_PROJECT_ID }}
          TF_VAR_region: ${{ vars.GCP_REGION }}
          TF_VAR_manage_rotate_secret_function: "false"
          TF_VAR_frontend_image: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.ARTIFACT_REGISTRY_REPO }}/frontend-api:${{ github.sha }}
          TF_VAR_backend_image: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.ARTIFACT_REGISTRY_REPO }}/backend-api:${{ github.sha }}
          TF_VAR_db_password: ${{ secrets.TF_VAR_DB_PASSWORD }}
          TF_VAR_jwt_secret: ${{ secrets.TF_VAR_JWT_SECRET }}
        run: terraform plan -out=tfplan

      - name: Upload plan artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: terraform-dev-plan
          path: |
            ${{ env.TF_WORKING_DIR }}/tfplan
            ${{ env.TF_WORKING_DIR }}/backend.auto.tf

  security-scan-dev:
    name: Security scan IaC (block High/Critical)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Trivy config scan (HIGH,CRITICAL)
        uses: aquasecurity/trivy-action@0.35.0
        with:
          scan-type: config
          scan-ref: infra/terraform
          severity: HIGH,CRITICAL
          exit-code: 1
          format: table

  apply-dev:
    name: Terraform apply (foundation-dev)
    runs-on: ubuntu-latest
    needs: [plan-dev, security-scan-dev]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.plan-dev.result == 'success' && needs.security-scan-dev.result == 'success'
    environment: gcp-dev

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud (OIDC)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SA }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Configure backend block for CI
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          cat > backend.auto.tf <<'EOF'
          terraform {
            backend "gcs" {}
          }
          EOF

      - name: Terraform init
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          terraform init \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="prefix=${{ vars.TF_STATE_PREFIX_DEV }}" \
            -upgrade

      - name: Adopt existing foundation resources into state (idempotent)
        working-directory: ${{ env.TF_WORKING_DIR }}
        env:
          TF_VAR_project_id: ${{ vars.GCP_PROJECT_ID }}
        run: |
          set -euo pipefail

          import_if_missing() {
            local address="$1"
            local import_id="$2"

            if terraform state show "$address" >/dev/null 2>&1; then
              echo "State already contains $address"
              return 0
            fi

            echo "Importing $address from $import_id"
            if terraform import "$address" "$import_id"; then
              echo "Imported $address"
            else
              echo "::warning::Could not import $address (it may not exist yet)."
            fi
          }

          PROJECT_ID="${{ vars.GCP_PROJECT_ID }}"
          ENV_NAME="foundation-dev"
          PREFIX="livemenu-${ENV_NAME}"
          BUCKET_NAME="${PREFIX}-images-${PROJECT_ID}"

          import_if_missing "module.vpc.google_compute_network.this" "projects/${PROJECT_ID}/global/networks/${PREFIX}-vpc"
          import_if_missing "google_service_account.worker[0]" "projects/${PROJECT_ID}/serviceAccounts/lm-worker-${ENV_NAME}@${PROJECT_ID}.iam.gserviceaccount.com"
          import_if_missing "module.waf[0].google_compute_security_policy.this" "projects/${PROJECT_ID}/global/securityPolicies/${PREFIX}-armor"
          import_if_missing "module.storage[0].google_storage_bucket.this" "${BUCKET_NAME}"

      - name: Terraform apply
        working-directory: ${{ env.TF_WORKING_DIR }}
        env:
          TF_VAR_project_id: ${{ vars.GCP_PROJECT_ID }}
          TF_VAR_region: ${{ vars.GCP_REGION }}
          TF_VAR_manage_rotate_secret_function: "false"
          TF_VAR_frontend_image: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.ARTIFACT_REGISTRY_REPO }}/frontend-api:${{ github.sha }}
          TF_VAR_backend_image: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.ARTIFACT_REGISTRY_REPO }}/backend-api:${{ github.sha }}
          TF_VAR_db_password: ${{ secrets.TF_VAR_DB_PASSWORD }}
          TF_VAR_jwt_secret: ${{ secrets.TF_VAR_JWT_SECRET }}
        run: terraform apply -auto-approve
