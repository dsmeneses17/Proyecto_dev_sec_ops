name: terraform-infra

on:
  pull_request:
    paths:
      - "infra/terraform/**"
      - ".github/workflows/terraform-infra.yml"
  push:
    branches: ["main"]
    paths:
      - "infra/terraform/**"
      - ".github/workflows/terraform-infra.yml"
  workflow_dispatch:

concurrency:
  group: terraform-foundation-dev-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write
  issues: write

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  TF_WORKING_DIR: infra/terraform/envs/foundation-dev
  TF_VERSION: "1.14.9"

jobs:
  plan-dev:
    name: Terraform plan (foundation-dev)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud (OIDC)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SA }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Configure backend block for CI
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          cat > backend.auto.tf <<'EOF'
          terraform {
            backend "gcs" {}
          }
          EOF

      - name: Terraform init
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          terraform init \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="prefix=${{ vars.TF_STATE_PREFIX_DEV }}" \
            -lockfile=readonly

      - name: Query remote Terraform state
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          terraform state pull > tfstate.remote.json
          echo "Remote state loaded from backend:"
          jq -r '"lineage=\(.lineage) serial=\(.serial) terraform_version=\(.terraform_version) resources=\((.resources // []) | length)"' tfstate.remote.json

      - name: Terraform fmt check
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform fmt -recursive

      - name: Terraform validate
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform validate

      - name: Terraform plan
        working-directory: ${{ env.TF_WORKING_DIR }}
        env:
          TF_VAR_db_password: ${{ secrets.TF_VAR_DB_PASSWORD }}
          TF_VAR_jwt_secret: ${{ secrets.TF_VAR_JWT_SECRET }}
        run: terraform plan -out=tfplan

      - name: Upload plan artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: terraform-dev-plan
          path: |
            ${{ env.TF_WORKING_DIR }}/tfplan
            ${{ env.TF_WORKING_DIR }}/backend.auto.tf


  security-scan-dev:
    name: Security scan IaC (block High/Critical)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Trivy config scan (HIGH,CRITICAL)
        uses: aquasecurity/trivy-action@0.35.0
        with:
          scan-type: config
          scan-ref: infra/terraform
          trivyignores: infra/terraform/.trivyignore
          tf-vars: infra/terraform/envs/foundation-dev/terraform.auto.tfvars
          severity: HIGH,CRITICAL
          exit-code: 1
          format: table

  validate-plan-dev:
    name: Validate Terraform plan (block destructive changes)
    runs-on: ubuntu-latest
    needs: [plan-dev]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download plan artifact
        uses: actions/download-artifact@v4
        with:
          name: terraform-dev-plan
          path: ${{ env.TF_WORKING_DIR }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform init (providers only)
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform init -backend=false -input=false -lockfile=readonly

      - name: Analyze plan for destructive actions
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          terraform show -json tfplan > tfplan.json

          destroy_count=$(jq '[.resource_changes[]? | select((.change.actions | index("delete")) != null)] | length' tfplan.json)
          echo "Destructive changes detected: ${destroy_count}"

          if [ "$destroy_count" -gt 0 ]; then
            echo "Plan contains delete actions. Review required before apply."
            exit 1
          fi

          echo "Validation passed: no delete actions found."

  manual-approval-dev:
    name: Manual approval before apply
    runs-on: ubuntu-latest
    needs: [security-scan-dev, validate-plan-dev]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.security-scan-dev.result == 'success' && needs.validate-plan-dev.result == 'success'

    steps:
      - name: Require explicit approval
        uses: trstringer/manual-approval@v1
        with:
          secret: ${{ github.token }}
          approvers: ${{ vars.TF_APPLY_APPROVERS != '' && vars.TF_APPLY_APPROVERS || github.actor }}
          minimum-approvals: 1
          issue-title: "Terraform apply approval required (foundation-dev)"
          issue-body: |
            Terraform apply for foundation-dev is waiting for manual approval.
            Review the plan and approve this request to continue.

  apply-dev:
    name: Terraform apply (foundation-dev)
    runs-on: ubuntu-latest
    needs: [plan-dev, security-scan-dev, validate-plan-dev, manual-approval-dev]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.plan-dev.result == 'success' && needs.security-scan-dev.result == 'success' && needs.validate-plan-dev.result == 'success' && needs.manual-approval-dev.result == 'success'
    environment: gcp-dev

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud (OIDC)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SA }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Configure backend block for CI
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          cat > backend.auto.tf <<'EOF'
          terraform {
            backend "gcs" {}
          }
          EOF

      - name: Terraform init
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          terraform init \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="prefix=${{ vars.TF_STATE_PREFIX_DEV }}" \
            -lockfile=readonly

      - name: Query remote Terraform state
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          terraform state pull > tfstate.remote.json
          echo "Remote state loaded from backend before apply:"
          jq -r '"lineage=\(.lineage) serial=\(.serial) terraform_version=\(.terraform_version) resources=\((.resources // []) | length)"' tfstate.remote.json

      - name: Download approved plan artifact
        uses: actions/download-artifact@v4
        with:
          name: terraform-dev-plan
          path: ${{ env.TF_WORKING_DIR }}

      - name: Terraform apply
        working-directory: ${{ env.TF_WORKING_DIR }}
        env:
          TF_VAR_db_password: ${{ secrets.TF_VAR_DB_PASSWORD }}
          TF_VAR_jwt_secret: ${{ secrets.TF_VAR_JWT_SECRET }}
        run: terraform apply -auto-approve tfplan
